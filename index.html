<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomify</title>
  <meta name="description" content="Anatomify — Learn anatomy like a game.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .landing {
      max-width: 480px;
      margin: 0 auto;
      padding: 80px 24px 40px;
      text-align: center;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .landing h1 {
      font-weight: 700;
      font-size: 40px;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }
    .landing p {
      color: var(--ink-soft);
      margin-bottom: 32px;
    }
    .landing .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .landing .links a {
      padding: 12px 20px;
      border-radius: 24px;
      background: var(--ink);
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .landing .links a.secondary {
      background: var(--bg-soft);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="landing">
    <h1>ANATOMIFY</h1>
    <p>Learn anatomy like a game.</p>
    <div class="links">
      <a href="/privacy">Privacy</a>
      <a href="/terms" class="secondary">Terms</a>
      <a href="/support" class="secondary">Support</a>
    </div>
  </main>
  <footer class="footer">
    <p>© 2026 Anatomify · <a href="mailto:hello@anatomify.app">hello@anatomify.app</a></p>
  </footer>
</body>
</html>
